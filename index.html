<!DOCTYPE html>
<html>

<head>
	<title>小孙同学</title>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, minimum-scale=1.0, maximum-scale=1.0">
	<style>
		html,
		body {
			height: 100%;
			background-color: #05070c;
		}

		body {
			background-image:
				radial-gradient(ellipse at 50% 45%, rgba(0, 130, 150, 0.16) 0%, rgba(0, 0, 0, 0) 62%),
				radial-gradient(ellipse at 78% 12%, rgba(80, 40, 160, 0.12) 0%, rgba(0, 0, 0, 0) 55%);
			background-attachment: fixed;
			background-repeat: no-repeat;
			margin: 0;
			font-family: Helvetica, sans-serif;
			;
			overflow: hidden;
		}

		a {
			color: #ffffff;
		}

		#info {
			position: absolute;
			width: 100%;
			color: #ffffff;
			padding: 5px;
			font-family: Monospace;
			font-size: 13px;
			font-weight: bold;
			text-align: center;
			z-index: 1;
		}

		.element {
			width: 100px;
			/* 120 160 */
			height: 100px;
			box-shadow: 0px 0px 12px rgba(0, 255, 255, 0.5);
			border: 1px solid rgba(127, 255, 255, 0.25);
			text-align: center;
			cursor: default;
		}

		.element:hover {
			box-shadow: 0px 0px 12px rgba(0, 255, 255, 0.75);
			border: 1px solid rgba(127, 255, 255, 0.75);
		}

		.element img {
			display: block;
			width: 100px;
			height: 100px;
			object-fit: cover;
		}

		.element .number {
			position: absolute;
			top: 20px;
			right: 20px;
			font-size: 12px;
			color: rgba(127, 255, 255, 0.75);
		}

		.element .symbol {
			position: absolute;
			top: 40px;
			left: 0px;
			right: 0px;
			font-size: 60px;
			font-weight: bold;
			color: rgba(255, 255, 255, 0.75);
			text-shadow: 0 0 10px rgba(0, 255, 255, 0.95);
		}

		.element .details {
			position: absolute;
			bottom: 15px;
			left: 0px;
			right: 0px;
			font-size: 12px;
			color: rgba(127, 255, 255, 0.75);
		}

		/* 移动端适配 */
		@media (max-width: 640px) {

			.element,
			.element img {
				width: 76px;
				height: 76px;
			}
		}
	</style>
</head>

		var camera, scene, renderer;
		var controls;
		var cameraDistance = 3000;

		var objects = [];
		var targets = { table: [], sphere: [], helix: [], grid: [] };

		// 按屏幕比例计算相机距离：竖屏（宽高比小）时自动拉远，避免内容被裁掉
		function getCameraDistance() {
			var aspect = window.innerWidth / Math.max(window.innerHeight, 1);
			var base = 3000;
			if (aspect >= 1) {
				return base;
			}
			return Math.min(base * (1 + (1 - aspect) * 1.6), 5000);
		}

		init();
		animate();

		function init() {

			camera = new THREE.PerspectiveCamera(40, window.innerWidth / window.innerHeight, 1, 10000);
			cameraDistance = getCameraDistance();
			camera.position.z = cameraDistance;

			scene = new THREE.Scene();

			// table

			for (var i = 0; i < table.length; i++) {

				var element = document.createElement('div');
				element.className = 'element';
				element.style.backgroundColor = 'rgba(0,127,127,' + (Math.random() * 0.5 + 0.25) + ')';

				var img = document.createElement('img');
				img.src = table[i].image;
				element.appendChild(img);


				/*var number = document.createElement( 'div' );
				number.className = 'number';
				number.textContent = (i/5) + 1;
				element.appendChild( number );

				var symbol = document.createElement( 'div' );
				symbol.className = 'symbol';
				symbol.textContent = table[ i ];
				element.appendChild( symbol );

				var details = document.createElement( 'div' );
				details.className = 'details';
				details.innerHTML = table[ i + 1 ] + '<br>' + table[ i + 2 ];
				element.appendChild( details );*/

				var object = new THREE.CSS3DObject(element);
				object.position.x = Math.random() * 4000 - 2000;
				object.position.y = Math.random() * 4000 - 2000;
				object.position.z = Math.random() * 4000 - 2000;
				scene.add(object);

				objects.push(object);

				// 表格需要坐标进行排序的
				var object = new THREE.Object3D();
				// object.position.x = ( table[ i + 3 ] * 140 ) - 1330;
				// object.position.y = - ( table[ i + 4 ] * 180 ) + 990;
				object.position.x = (table[i].p_x * 140) - 1330;
				object.position.y = - (table[i].p_y * 180) + 990;

				targets.table.push(object);

			}

			// sphere

			var vector = new THREE.Vector3();
			var spherical = new THREE.Spherical();

			for (var i = 0, l = objects.length; i < l; i++) {

				var phi = Math.acos(-1 + (2 * i) / l);
				var theta = Math.sqrt(l * Math.PI) * phi;

				var object = new THREE.Object3D();

				spherical.set(800, phi, theta);

				object.position.setFromSpherical(spherical);

				vector.copy(object.position).multiplyScalar(2);

				object.lookAt(vector);

				targets.sphere.push(object);

			}

			// helix

			var vector = new THREE.Vector3();
			var cylindrical = new THREE.Cylindrical();

			for (var i = 0, l = objects.length; i < l; i++) {

				var theta = i * 0.175 + Math.PI;
				var y = - (i * 5) + 450;

				var object = new THREE.Object3D();

				// 参数一 圈的大小 参数二 左右间距 参数三 上下间距
				cylindrical.set(900, theta, y);

				object.position.setFromCylindrical(cylindrical);

				vector.x = object.position.x * 2;
				vector.y = object.position.y;
				vector.z = object.position.z * 2;

				object.lookAt(vector);

				targets.helix.push(object);

			}

			// grid

			for (var i = 0; i < objects.length; i++) {

				var object = new THREE.Object3D();

				object.position.x = ((i % 5) * 400) - 800; // 400 图片的左右间距  800 x轴中心店
				object.position.y = (- (Math.floor(i / 5) % 5) * 300) + 500;  // 500 y轴中心店
				object.position.z = (Math.floor(i / 25)) * 200 - 800;// 300调整 片间距 800z轴中心店

				targets.grid.push(object);

			}

			//渲染
			renderer = new THREE.CSS3DRenderer();
			renderer.setSize(window.innerWidth, window.innerHeight);
			renderer.domElement.style.position = 'absolute';
			document.getElementById('container').appendChild(renderer.domElement);

			// 鼠标控制
			controls = new THREE.TrackballControls(camera, renderer.domElement);
			controls.rotateSpeed = 0.5;
			controls.minDistance = 500;
			controls.maxDistance = 8000;
			controls.addEventListener('change', render);

			// 自动循环切换形态：表格 -> 球球 -> 螺旋 -> 格子
			var shapes = [targets.table, targets.sphere, targets.helix, targets.grid];
			var shapeIndex = 0;

			transform(shapes[shapeIndex], 2000);

			setInterval(function () {
				shapeIndex = (shapeIndex + 1) % shapes.length;
				transform(shapes[shapeIndex], 2000);
			}, 8000);

			//

			window.addEventListener('resize', onWindowResize, false);

		}

		function transform(targets, duration) {

			TWEEN.removeAll();

			for (var i = 0; i < objects.length; i++) {

				var object = objects[i];
				var target = targets[i];

				new TWEEN.Tween(object.position)
					.to({ x: target.position.x, y: target.position.y, z: target.position.z }, Math.random() * duration + duration)
					.easing(TWEEN.Easing.Exponential.InOut)
					.start();

				new TWEEN.Tween(object.rotation)
					.to({ x: target.rotation.x, y: target.rotation.y, z: target.rotation.z }, Math.random() * duration + duration)
					.easing(TWEEN.Easing.Exponential.InOut)
					.start();

			}

			new TWEEN.Tween(this)
				.to({}, duration * 2)
				.onUpdate(render)
				.start();

		}

		function onWindowResize() {

			// 保持用户缩放比例，仅按新旧基准距离调整相机远近
			var target = getCameraDistance();
			if (cameraDistance > 0) {
				camera.position.multiplyScalar(target / cameraDistance);
			}
			cameraDistance = target;

			camera.aspect = window.innerWidth / window.innerHeight;
			camera.updateProjectionMatrix();

			renderer.setSize(window.innerWidth, window.innerHeight);

			render();

		}

		function animate() {

			// 让场景通过x轴或者y轴旋转  & z
			// scene.rotation.x += 0.011;
			scene.rotation.y += 0.008;

			requestAnimationFrame(animate);

			TWEEN.update();

			controls.update();

			// 渲染循环
			render();

		}

		function render() {

			renderer.render(scene, camera);

		}

	</script>
